<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP App</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1a1a1a);
    --muted: var(--color-text-secondary, #6a6a6a);
    --accent: var(--color-accent, #2563eb);
    --border: var(--color-border-primary, rgba(0,0,0,0.08));
    --row: var(--color-background-secondary, rgba(0,0,0,0.02));
    --radius: var(--border-radius-md, 8px);
    --shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,0.04));
    --font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { padding: 12px 16px 20px 16px; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .title { font-size: 14px; font-weight: 600; }
  .subtitle { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; padding: 24px 0; text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); background: var(--row); position: sticky; top: 0; }
  tr:hover td { background: var(--row); }
  .card { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v { word-break: break-word; }
  pre.json { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 10px 12px; background: var(--row); border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; }
  td.select-cell, th.select-cell { width: 28px; padding: 6px 4px 6px 10px; }
  .form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .form-card { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 16px 18px; min-width: 280px; max-width: min(540px, calc(100vw - 40px)); width: 100%; max-height: calc(100vh - 40px); overflow: auto; }
  .form-card h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 600; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-row label { font-size: 12px; color: var(--muted); }
  .form-row input, .form-row textarea { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); }
  .form-row textarea { min-height: 64px; resize: vertical; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--row); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .alert { padding: 10px 12px; border-radius: var(--radius); border: 1px solid #f5c6cb; background: #fbe9eb; color: #842029; font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    .alert { background: #3b1f23; color: #f8b4ba; border-color: #5a2a30; }
  }
  .prompt-panel { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: var(--radius); background: var(--row); font-size: 13px; }
  .prompt-panel .prompt-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .prompt-panel .prompt-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-word; white-space: pre-wrap; margin-bottom: 6px; }
  .prompt-panel .prompt-actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for tool result&hellip;</div></div>
<script>
(function () {
  // -------------------- postMessage protocol shim --------------------
  // Implements the View side of the MCP Apps protocol
  // (io.modelcontextprotocol/ui, SEP-1865). All we need:
  //  - send `ui/initialize`, then `ui/notifications/initialized`
  //  - listen for `ui/notifications/tool-result` (and tool-input)
  //  - send `tools/call` requests when the user clicks an action
  // See: https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx
  var nextId = 1;
  var pending = new Map();
  var hostContext = null;
  var hostCapabilities = null;
  var lastResult = null;
  var renderer = "auto";
  var resourceUri = null;
  var toolName = null;

  // Tracks the user's table-row selection. Indexes into the row array
  // currently being rendered; cleared on every render() so a fresh
  // tool-result resets the picker. Action buttons read from this when
  // resolving `${field}` substitutions for `select: single|multi`
  // actions.
  var selection = { rows: [], selectedIdx: null, multiIdx: new Set() };

  // -------------------- debug overlay --------------------
  // Gated on `?debug=1` in the iframe URL. Renders a fixed-position
  // log of every postMessage in/out plus current state. Lets us see the
  // SEP-1865 handshake from inside the iframe in hosts (Claude.ai's
  // sandbox proxy) where opening a JS console on the iframe is awkward.
  var DEBUG = (function () {
    try {
      if (/[?&]debug=1\b/.test(location.search)) return true;
      var m = document.querySelector('meta[name="x-mcp-debug"]');
      return !!(m && m.getAttribute("content") === "1");
    } catch (_) { return false; }
  })();
  var debugLogEl = null;
  function debugInit() {
    if (!DEBUG || debugLogEl) return;
    debugLogEl = document.createElement("pre");
    debugLogEl.id = "mcp-debug-overlay";
    debugLogEl.style.cssText = [
      "position:fixed", "left:0", "right:0", "bottom:0",
      "max-height:50vh", "margin:0", "padding:8px 10px",
      "font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace",
      "background:rgba(0,0,0,0.85)", "color:#9ef79e",
      "white-space:pre-wrap", "word-break:break-word",
      "overflow:auto", "z-index:2147483647",
      "border-top:1px solid #444"
    ].join(";");
    debugLogEl.textContent = "[debug] overlay attached\n";
    var attach = function () { document.body.appendChild(debugLogEl); };
    if (document.body) attach();
    else document.addEventListener("DOMContentLoaded", attach);
  }
  function dbg(direction, msg) {
    if (!DEBUG) return;
    debugInit();
    if (!debugLogEl) return;
    var line = "[" + new Date().toISOString().slice(11, 23) + "] " + direction + " ";
    try { line += JSON.stringify(msg); } catch (_) { line += String(msg); }
    debugLogEl.textContent += line + "\n";
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  }
  debugInit();

  // The host origin we're embedded under. Captured from the first
  // inbound `event.origin` so we can scope `postMessage` targetOrigin
  // tightly. Some hosts (notably MCP Inspector at
  // `inspector.modelcontextprotocol.io`) refuse messages sent with
  // a `*` target when running cross-origin under a strict CSP. We
  // start permissive (`*`) and tighten as soon as we know.
  var hostOrigin = "*";

  function send(msg) {
    dbg("OUT", msg);
    try {
      window.parent.postMessage(msg, hostOrigin);
    } catch (_) {
      // Origin became invalid (e.g. host navigated); fall back so we
      // don't drop the message silently.
      try { window.parent.postMessage(msg, "*"); } catch (__) { /* give up */ }
    }
  }

  function call(method, params) {
    var id = nextId++;
    var msg = { jsonrpc: "2.0", id: id, method: method, params: params || {} };
    return new Promise(function (resolve, reject) {
      pending.set(id, { resolve: resolve, reject: reject });
      send(msg);
    });
  }

  function notify(method, params) {
    send({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    dbg("IN", msg);
    if (!msg || typeof msg !== "object") return;
    if (msg.jsonrpc !== "2.0") return;
    // First inbound JSON-RPC frame carries the host's actual origin —
    // pin our outbound `postMessage` target to it so subsequent
    // messages survive strict cross-origin isolation (Inspector).
    if (hostOrigin === "*" && event.origin && event.origin !== "null") {
      hostOrigin = event.origin;
      dbg("HOST_ORIGIN", hostOrigin);
    }
    if (typeof msg.id !== "undefined" && (msg.result || msg.error)) {
      // Response to one of our requests.
      var p = pending.get(msg.id);
      if (!p) return;
      pending.delete(msg.id);
      if (msg.error) p.reject(msg.error); else p.resolve(msg.result);
      return;
    }
    if (typeof msg.method === "string") {
      handleNotification(msg);
    }
  });

  function handleNotification(msg) {
    switch (msg.method) {
      case "ui/notifications/tool-result":
        lastResult = msg.params;
        render();
        emitSize();
        break;
      case "ui/notifications/tool-input":
      case "ui/notifications/tool-input-partial":
        // We don't need the input for the auto-renderer; ignore.
        break;
      case "ui/notifications/host-context-changed":
        if (hostContext && msg.params && typeof msg.params === "object") {
          for (var k in msg.params) hostContext[k] = msg.params[k];
          applyTheme();
          render();
        }
        break;
    }
  }

  function applyTheme() {
    if (!hostContext || !hostContext.styles || !hostContext.styles.variables) return;
    var vars = hostContext.styles.variables;
    var root = document.documentElement.style;
    for (var k in vars) root.setProperty(k, vars[k]);
    if (hostContext.styles.css && hostContext.styles.css.fonts) {
      var s = document.createElement("style");
      s.textContent = hostContext.styles.css.fonts;
      document.head.appendChild(s);
    }
  }

  // -------------------- handshake --------------------
  // `appCapabilities` lists capabilities the *View* implements. The
  // SEP-1865 spec only defines a small set here (chiefly `displayModes`);
  // earlier versions of this bundle sent `{tools:{listChanged:false}}`,
  // which is not a valid View capability and may cause strict hosts to
  // silently drop subsequent `ui/notifications/tool-result` pushes.
  call("ui/initialize", {
    protocolVersion: "2026-01-26",
    appCapabilities: {
      displayModes: ["inline", "fullscreen"]
    },
    appInfo: { name: "mcp-apps-policy/auto", version: "0.1.0" }
  }).then(function (result) {
    hostContext = result && result.hostContext ? result.hostContext : {};
    // SEP-1865 returns `hostCapabilities` on `ui/initialize`. Apps must
    // gate `ui/message` (post a user turn into the conversation) on
    // `hostCapabilities.message` — hosts that don't advertise it will
    // silently drop the request. Pin this so prompt-mode actions know
    // whether the host can route the message back to the agent.
    hostCapabilities = (result && result.hostCapabilities) || {};
    if (hostContext && hostContext.toolInfo && hostContext.toolInfo.tool) {
      toolName = hostContext.toolInfo.tool.name || null;
    }
    applyTheme();
    // Per SEP-1865, the host gates `tool-input` / `tool-result` pushes on
    // having received `initialized` from the View. Send it before any
    // render so the bridge can flush queued notifications.
    notify("ui/notifications/initialized");
    render();
    emitSize();
  }).catch(function () {
    // The host did not respond. Render whatever we have anyway.
    render();
    emitSize();
  });

  // -------------------- size reporting --------------------
  // Some hosts (e.g. Claude.ai's wrapper) keep the iframe container
  // hidden (`visibility: hidden`, `height: 0`) until the View reports a
  // positive size. Emit early — before the first tool result arrives —
  // so the placeholder is visible while we wait, and re-emit on every
  // render so the host can grow/shrink the row.
  function emitSize() {
    try {
      var w = document.documentElement.scrollWidth || document.body.scrollWidth || 1;
      var h = document.body.scrollHeight || document.documentElement.scrollHeight || 1;
      notify("ui/notifications/size-changed", { width: w, height: h });
    } catch (_) { /* best-effort */ }
  }
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(emitSize).observe(document.body);
  }
  // Fire once as soon as the DOM is laid out, in case the host's reveal
  // gate triggers before `ui/initialize` resolves.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", emitSize);
  } else {
    requestAnimationFrame(emitSize);
  }

  // -------------------- rendering --------------------
  function render() {
    var root = document.getElementById("root");
    if (!lastResult) {
      root.innerHTML = '<div class="empty">Waiting for tool result&hellip;</div>';
      return;
    }
    var meta = lastResult._meta || {};
    // SEP-1865 hosts (Claude.ai) put metadata under
    // `_meta["io.modelcontextprotocol/ui"]`; relaxed hosts and our
    // own bundle accept the `_meta.ui` alias. Read whichever is set.
    var ui = meta["io.modelcontextprotocol/ui"] || meta.ui || {};
    if (ui.renderer) renderer = ui.renderer;
    if (ui.resourceUri) resourceUri = ui.resourceUri;

    var displayName = toolName || (hostContext && hostContext.toolInfo && hostContext.toolInfo.tool && hostContext.toolInfo.tool.name) || "Tool result";
    var data = lastResult.structuredContent;
    if (typeof data === "undefined") {
      var content = (lastResult.content && lastResult.content[0]) || null;
      if (content && content.type === "text" && typeof content.text === "string") {
        try { data = JSON.parse(content.text); }
        catch (e) { data = content.text; }
      }
    }
    // formTools[] short-circuit. When the policy intercepts a
    // `tools/call` for a tool listed in `formTools`, it returns a
    // synthetic structuredContent with `_mcpAppsForm: true`. Render a
    // pre-call confirmation form whose submit re-issues the call with
    // `_mcpAppsConfirmed: true`; the policy strips the marker and
    // forwards upstream.
    if (data && typeof data === "object" && data._mcpAppsForm === true) {
      root.innerHTML = '';
      root.appendChild(buildHeader(displayName, "Confirm before submitting"));
      root.appendChild(buildPreCallForm(data));
      emitSize();
      return;
    }
    // The policy wraps top-level arrays under `{items: [...]}` so the
    // result is a valid MCP `structuredContent` object. Unwrap that
    // shape on the renderer side so the table view still kicks in.
    if (data && typeof data === "object" && !Array.isArray(data)) {
      var keys = Object.keys(data);
      if (keys.length === 1 && keys[0] === "items" && Array.isArray(data.items)) {
        data = data.items;
      }
    }

    // Decide whether the action bar wants any kind of row selection.
    // The table renderer needs to know up-front so it can prepend the
    // radio/checkbox column.
    var actions = pickActions();
    var wantsSingle = actions.some(function (a) { return a.select === "single"; });
    var wantsMulti = actions.some(function (a) { return a.select === "multi"; });

    // Reset selection state for every fresh tool-result.
    selection = { rows: [], selectedIdx: null, multiIdx: new Set() };

    if (lastResult.isError) {
      root.innerHTML = '';
      root.appendChild(buildHeader(displayName, "Error"));
      var box = document.createElement("div");
      box.className = "alert";
      box.textContent = stringifyForError(lastResult);
      root.appendChild(box);
      root.appendChild(buildActions(data, actions));
      return;
    }

    var body = pickRenderer(renderer, data, { wantsSingle: wantsSingle, wantsMulti: wantsMulti, refresh: refreshActionState });
    root.innerHTML = '';
    root.appendChild(buildHeader(displayName, body.subtitle));
    root.appendChild(body.node);
    root.appendChild(buildActions(data, actions));
  }

  function pickActions() {
    var meta = (lastResult && lastResult._meta) || {};
    var ui = meta["io.modelcontextprotocol/ui"] || meta.ui || {};
    return Array.isArray(ui.actions) ? ui.actions : [];
  }

  // Re-evaluates which action buttons are enabled given the current
  // row selection. Wired into the table renderer so radio/checkbox
  // changes flip buttons live without a full re-render.
  function refreshActionState() {
    var btns = document.querySelectorAll("button[data-action-idx]");
    btns.forEach(function (btn) {
      var idx = parseInt(btn.getAttribute("data-action-idx"), 10);
      var actions = pickActions();
      var a = actions[idx];
      if (!a) return;
      var enabled = true;
      if (a.select === "single") enabled = selection.selectedIdx !== null;
      else if (a.select === "multi") enabled = selection.multiIdx.size > 0;
      btn.disabled = !enabled;
    });
  }

  function buildHeader(title, subtitle) {
    var div = document.createElement("div");
    div.className = "header";
    var t = document.createElement("div");
    t.className = "title";
    t.textContent = title;
    div.appendChild(t);
    if (subtitle) {
      var s = document.createElement("div");
      s.className = "subtitle";
      s.textContent = subtitle;
      div.appendChild(s);
    }
    return div;
  }

  function pickRenderer(name, data, opts) {
    opts = opts || {};
    if (name && name !== "auto") {
      var fn = renderers[name];
      if (fn) return fn(data, opts);
    }
    if (Array.isArray(data) && data.length && data.every(isPlainObject)) {
      return renderers.table(data, opts);
    }
    if (isPlainObject(data)) {
      return renderers.card(data, opts);
    }
    return renderers.json(data, opts);
  }

  function isPlainObject(v) {
    return v && typeof v === "object" && !Array.isArray(v);
  }

  var renderers = {
    json: function (data, _opts) {
      var pre = document.createElement("pre");
      pre.className = "json";
      try { pre.textContent = JSON.stringify(data, null, 2); }
      catch (e) { pre.textContent = String(data); }
      return { node: pre, subtitle: "JSON" };
    },
    card: function (data, _opts) {
      var card = document.createElement("div");
      card.className = "card";
      var grid = document.createElement("div");
      grid.className = "kv";
      var keys = Object.keys(data || {});
      if (!keys.length) {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "(empty object)";
        return { node: empty, subtitle: "" };
      }
      keys.forEach(function (k) {
        var dk = document.createElement("div"); dk.className = "k"; dk.textContent = k;
        var dv = document.createElement("div"); dv.className = "v"; dv.textContent = formatValue(data[k]);
        grid.appendChild(dk); grid.appendChild(dv);
      });
      card.appendChild(grid);
      return { node: card, subtitle: keys.length + " fields" };
    },
    table: function (rows, opts) {
      opts = opts || {};
      if (!Array.isArray(rows) || !rows.length) {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "(empty list)";
        return { node: empty, subtitle: "0 rows" };
      }
      // Stash row data so action handlers can resolve `${field}` / `${rows[].Field}`
      // against the picked rows without recomputing.
      selection.rows = rows;
      var columns = collectColumns(rows);
      var wantsSingle = !!opts.wantsSingle;
      var wantsMulti = !!opts.wantsMulti;
      var refresh = typeof opts.refresh === "function" ? opts.refresh : function () {};
      var wrap = document.createElement("div"); wrap.style.overflow = "auto";
      var table = document.createElement("table");
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      if (wantsMulti) {
        var thAll = document.createElement("th");
        thAll.className = "select-cell";
        // Header checkbox: select all / clear all.
        var allBox = document.createElement("input");
        allBox.type = "checkbox";
        allBox.setAttribute("aria-label", "Select all");
        allBox.addEventListener("change", function () {
          if (allBox.checked) {
            selection.multiIdx = new Set(rows.map(function (_, i) { return i; }));
          } else {
            selection.multiIdx = new Set();
          }
          // Sync row checkboxes.
          tbody.querySelectorAll("input[type=checkbox][data-row-idx]").forEach(function (b) {
            var i = parseInt(b.getAttribute("data-row-idx"), 10);
            b.checked = selection.multiIdx.has(i);
          });
          refresh();
        });
        thAll.appendChild(allBox);
        hr.appendChild(thAll);
      } else if (wantsSingle) {
        var thR = document.createElement("th");
        thR.className = "select-cell";
        thR.textContent = "";
        hr.appendChild(thR);
      }
      columns.forEach(function (c) { var th = document.createElement("th"); th.textContent = c; hr.appendChild(th); });
      thead.appendChild(hr); table.appendChild(thead);
      var tbody = document.createElement("tbody");
      rows.forEach(function (row, rowIdx) {
        var tr = document.createElement("tr");
        if (wantsMulti) {
          var td = document.createElement("td");
          td.className = "select-cell";
          var box = document.createElement("input");
          box.type = "checkbox";
          box.setAttribute("data-row-idx", String(rowIdx));
          box.setAttribute("aria-label", "Select row " + (rowIdx + 1));
          box.addEventListener("change", function () {
            if (box.checked) selection.multiIdx.add(rowIdx);
            else selection.multiIdx.delete(rowIdx);
            refresh();
          });
          td.appendChild(box);
          tr.appendChild(td);
        } else if (wantsSingle) {
          var td2 = document.createElement("td");
          td2.className = "select-cell";
          var radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "mcp-row-select";
          radio.setAttribute("data-row-idx", String(rowIdx));
          radio.setAttribute("aria-label", "Select row " + (rowIdx + 1));
          radio.addEventListener("change", function () {
            if (radio.checked) selection.selectedIdx = rowIdx;
            refresh();
          });
          td2.appendChild(radio);
          tr.appendChild(td2);
        }
        columns.forEach(function (c) {
          var cell = document.createElement("td");
          cell.textContent = formatValue(row && row[c]);
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      return { node: wrap, subtitle: rows.length + " row" + (rows.length === 1 ? "" : "s") };
    },
    form: function (data, _opts) {
      // Read-only form; submission would need a configured action.
      var card = renderers.card(data || {}, _opts);
      card.subtitle = "Form view (read-only)";
      return card;
    }
  };

  function collectColumns(rows) {
    var seen = Object.create(null);
    var cols = [];
    rows.forEach(function (row) {
      if (row && typeof row === "object" && !Array.isArray(row)) {
        Object.keys(row).forEach(function (k) {
          if (!seen[k]) { seen[k] = true; cols.push(k); }
        });
      }
    });
    return cols.length ? cols : ["value"];
  }

  function formatValue(v) {
    if (v === null) return "—";
    if (typeof v === "undefined") return "";
    if (typeof v === "object") {
      try { return JSON.stringify(v); } catch (e) { return String(v); }
    }
    return String(v);
  }

  function stringifyForError(result) {
    try {
      var content = result.content && result.content[0];
      if (content && content.type === "text" && content.text) return content.text;
      return JSON.stringify(result, null, 2);
    } catch (e) {
      return String(result);
    }
  }

  // -------------------- actions --------------------
  // Action shapes shipped by the policy:
  //   { tool, label, select: "none"|"single"|"multi",
  //     mode: "call"|"form",
  //     arguments?: <pre-resolved object>,
  //     argsTemplate?: <raw JSON template the bundle resolves
  //                    against the current row pick> }
  function buildActions(currentData, actionsArg) {
    var actions = Array.isArray(actionsArg) ? actionsArg : pickActions();
    var div = document.createElement("div");
    if (!actions.length) return div;
    div.className = "actions";
    actions.forEach(function (a, i) {
      var btn = document.createElement("button");
      btn.setAttribute("data-action-idx", String(i));
      if (i === 0) btn.classList.add("primary");
      btn.textContent = a.label || a.tool || "Run";
      // Initial enabled/disabled state based on selection requirements.
      var sel = a.select || "none";
      if (sel === "single") btn.disabled = selection.selectedIdx === null;
      else if (sel === "multi") btn.disabled = selection.multiIdx.size === 0;
      btn.addEventListener("click", function () {
        if (!a.tool) return;
        runAction(a, btn, currentData);
      });
      div.appendChild(btn);
    });
    return div;
  }

  function runAction(a, btn, currentData) {
    var sel = a.select || "none";
    var mode = a.mode || "call";
    if (mode === "form" && sel === "single") {
      var idx = selection.selectedIdx;
      if (idx === null) return;
      var row = selection.rows[idx] || {};
      openInlineForm(a, row, btn);
      return;
    }
    if (mode === "prompt") {
      // Resolve prompt template against the current selection / row /
      // top-level data and hand the message back to the host so the
      // agent re-decides whether to call the tool. The iframe never
      // calls the tool directly in this mode — the tool call (if any)
      // appears in the conversation as the agent's own decision.
      firePromptAction(a, btn, currentData);
      return;
    }
    var args = resolveActionArgs(a, currentData);
    fireToolsCall(a, args, btn);
  }

  // Resolve `${field}` placeholders in an action's arguments.
  // - select: "none"   → server already substituted; ship a.arguments.
  // - select: "single" → substitute against the picked row.
  // - select: "multi"  → support `${rows}` (whole array) and
  //                       `${rows[].Field}` (project Field across rows).
  function resolveActionArgs(a, currentData) {
    var sel = a.select || "none";
    if (sel === "none") return a.arguments || {};
    if (sel === "single") {
      var idx = selection.selectedIdx;
      var row = idx === null ? {} : (selection.rows[idx] || {});
      // `${row}` substitutes the whole row object; `${Field}` still
      // pulls individual values.
      var ctx = {};
      Object.keys(row).forEach(function (k) { ctx[k] = row[k]; });
      ctx.row = row;
      return substituteValue(a.argsTemplate || a.arguments || {}, ctx);
    }
    // multi
    var picked = [];
    selection.multiIdx.forEach(function (i) { picked.push(selection.rows[i]); });
    return substituteMulti(a.argsTemplate || a.arguments || {}, picked);
  }

  function substituteValue(node, ctx) {
    if (typeof node === "string") return substituteString(node, ctx);
    if (Array.isArray(node)) return node.map(function (v) { return substituteValue(v, ctx); });
    if (node && typeof node === "object") {
      var out = {};
      Object.keys(node).forEach(function (k) { out[k] = substituteValue(node[k], ctx); });
      return out;
    }
    return node;
  }

  function substituteString(s, ctx) {
    // If the entire string is a single `${expr}`, return the raw value
    // (so numbers stay numbers, objects stay objects). Otherwise do an
    // in-string substitution with stringified values.
    var whole = /^\$\{([^}]+)\}$/.exec(s);
    if (whole) {
      var v = lookupSingle(ctx, whole[1]);
      return v === undefined ? s : v;
    }
    return s.replace(/\$\{([^}]+)\}/g, function (m, key) {
      var v = lookupSingle(ctx, key);
      if (v === undefined) return m;
      if (v === null) return "";
      if (typeof v === "object") { try { return JSON.stringify(v); } catch (_) { return String(v); } }
      return String(v);
    });
  }

  function lookupSingle(ctx, dotted) {
    if (ctx == null) return undefined;
    var cur = ctx;
    var parts = dotted.split(".");
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  // Multi-row substitution. Supports:
  //  - `${rows}`             → the entire array of selected rows.
  //  - `${rows[].Field}`     → array projecting `Field` across rows.
  //  - any other `${field}`  → resolved against the *first* selected
  //                            row (best-effort; pick a different shape
  //                            if your tool actually wants a join).
  function substituteMulti(node, rows) {
    if (typeof node === "string") {
      var whole = /^\$\{([^}]+)\}$/.exec(node);
      if (whole) {
        var key = whole[1];
        if (key === "rows") return rows;
        var proj = /^rows\[\]\.(.+)$/.exec(key);
        if (proj) {
          var field = proj[1];
          return rows.map(function (r) { return r ? r[field] : undefined; });
        }
        return substituteString(node, rows[0] || {});
      }
      return substituteString(node, rows[0] || {});
    }
    if (Array.isArray(node)) return node.map(function (v) { return substituteMulti(v, rows); });
    if (node && typeof node === "object") {
      var out = {};
      Object.keys(node).forEach(function (k) { out[k] = substituteMulti(node[k], rows); });
      return out;
    }
    return node;
  }

  // Open a modal-ish inline form built from the selected row's keys.
  // System fields (`Id`, …) are passed through unchanged but hidden so
  // operators don't accidentally edit immutable identifiers.
  var SYSTEM_FIELDS = ["Id", "id", "_id", "createdAt", "updatedAt", "CreatedAt", "UpdatedAt", "createdDate", "lastModifiedDate"];

  function openInlineForm(action, row, originBtn) {
    // Snapshot existing values, hide system fields, expose editables.
    var passthroughEntries = [];
    var editableKeys = [];
    Object.keys(row || {}).forEach(function (k) {
      if (SYSTEM_FIELDS.indexOf(k) !== -1) {
        passthroughEntries.push([k, row[k]]);
        return;
      }
      editableKeys.push(k);
    });

    var overlay = document.createElement("div");
    overlay.className = "form-overlay";
    var card = document.createElement("div");
    card.className = "form-card";
    var h = document.createElement("h3");
    h.textContent = action.label || action.tool || "Edit";
    card.appendChild(h);

    var inputs = {};
    editableKeys.forEach(function (k) {
      var rowEl = document.createElement("div");
      rowEl.className = "form-row";
      var label = document.createElement("label");
      label.textContent = k;
      rowEl.appendChild(label);
      var v = row[k];
      var input;
      if (typeof v === "object" && v !== null) {
        input = document.createElement("textarea");
        try { input.value = JSON.stringify(v, null, 2); }
        catch (_) { input.value = String(v); }
        input.setAttribute("data-type", "json");
      } else if (typeof v === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!v;
        input.setAttribute("data-type", "boolean");
      } else if (typeof v === "number") {
        input = document.createElement("input");
        input.type = "number";
        input.value = String(v);
        input.setAttribute("data-type", "number");
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = v == null ? "" : String(v);
        input.setAttribute("data-type", "string");
      }
      rowEl.appendChild(input);
      inputs[k] = input;
      card.appendChild(rowEl);
    });

    var formActions = document.createElement("div");
    formActions.className = "form-actions";
    var cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    cancel.addEventListener("click", function () { document.body.removeChild(overlay); });
    var submit = document.createElement("button");
    submit.classList.add("primary");
    submit.textContent = action.label || "Save";
    submit.addEventListener("click", function () {
      // Reconstruct the row with edits, then build args. If the action
      // ships an `argsTemplate`, render it against the edited row;
      // otherwise pass the merged row directly.
      var edited = {};
      passthroughEntries.forEach(function (p) { edited[p[0]] = p[1]; });
      Object.keys(inputs).forEach(function (k) {
        var inp = inputs[k];
        var t = inp.getAttribute("data-type");
        if (t === "boolean") edited[k] = !!inp.checked;
        else if (t === "number") {
          var n = Number(inp.value);
          edited[k] = isNaN(n) ? inp.value : n;
        }
        else if (t === "json") {
          try { edited[k] = JSON.parse(inp.value); }
          catch (_) { edited[k] = inp.value; }
        }
        else edited[k] = inp.value;
      });
      var args;
      if (action.argsTemplate) {
        // Make `${row}` resolve to the whole edited row, while still
        // letting field-level placeholders (`${Id}`, `${Name}`, …)
        // pull individual values. We layer `row` on top of `edited`
        // so a literal column named `row` is shadowed (rare).
        var ctx = {};
        Object.keys(edited).forEach(function (k) { ctx[k] = edited[k]; });
        ctx.row = edited;
        args = substituteValue(action.argsTemplate, ctx);
      } else {
        args = edited;
      }
      submit.disabled = true;
      cancel.disabled = true;
      fireToolsCall(action, args, originBtn).then(function () {
        if (overlay.parentNode) document.body.removeChild(overlay);
      }).catch(function () {
        // Leave the form open so the user can retry/edit.
        submit.disabled = false;
        cancel.disabled = false;
      });
    });
    formActions.appendChild(cancel);
    formActions.appendChild(submit);
    card.appendChild(formActions);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    emitSize();
  }

  // -------------------- pre-call form --------------------
  // Renders a confirmation form for tools listed in `formTools`. The
  // policy short-circuits the agent's first `tools/call` with a
  // synthetic structuredContent of:
  //   { _mcpAppsForm: true,
  //     tool: "<name>",
  //     values: { ...agent-supplied args },
  //     fields: [ { name, label, type, placeholder, required }, ... ] }
  //
  // The bundle merges agent values + operator-declared fields, lets the
  // user edit, then re-issues `tools/call` with the original arg shape
  // plus `_mcpAppsConfirmed: true`. The policy strips that marker and
  // forwards upstream.
  function buildPreCallForm(payload) {
    var wrap = document.createElement("div");
    wrap.className = "form-card";
    wrap.style.boxShadow = "none";
    wrap.style.padding = "0";

    var note = document.createElement("div");
    note.className = "subtitle";
    note.textContent = "Review the agent's arguments and add any optional fields, then submit.";
    wrap.appendChild(note);

    var values = (payload.values && typeof payload.values === "object") ? payload.values : {};
    var declared = Array.isArray(payload.fields) ? payload.fields : [];

    // Field set = declared fields ∪ keys present in agent values.
    // Declared fields render in the configured order first, then any
    // extra agent-supplied keys appear after (so the user can see what
    // the agent already filled in).
    var seen = Object.create(null);
    var ordered = [];
    declared.forEach(function (f) {
      if (!f || !f.name || seen[f.name]) return;
      seen[f.name] = true;
      ordered.push(f);
    });
    Object.keys(values).forEach(function (k) {
      if (seen[k]) return;
      seen[k] = true;
      ordered.push({ name: k, label: k, type: inferFieldType(values[k]) });
    });

    var inputs = {};
    ordered.forEach(function (f) {
      var rowEl = document.createElement("div");
      rowEl.className = "form-row";
      var label = document.createElement("label");
      label.textContent = (f.label || f.name) + (f.required ? " *" : "");
      rowEl.appendChild(label);
      var v = values[f.name];
      var t = (f.type || "string").toLowerCase();
      var input;
      if (t === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!v;
        input.setAttribute("data-type", "boolean");
      } else if (t === "number") {
        input = document.createElement("input");
        input.type = "number";
        if (v != null) input.value = String(v);
        if (f.placeholder) input.placeholder = String(f.placeholder);
        input.setAttribute("data-type", "number");
      } else if (t === "json") {
        input = document.createElement("textarea");
        if (v != null) {
          try { input.value = JSON.stringify(v, null, 2); }
          catch (_) { input.value = String(v); }
        }
        if (f.placeholder) input.placeholder = String(f.placeholder);
        input.setAttribute("data-type", "json");
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = v == null ? "" : String(v);
        if (f.placeholder) input.placeholder = String(f.placeholder);
        input.setAttribute("data-type", "string");
      }
      if (f.required) input.setAttribute("data-required", "1");
      inputs[f.name] = input;
      rowEl.appendChild(input);
      wrap.appendChild(rowEl);
    });

    var formActions = document.createElement("div");
    formActions.className = "form-actions";
    var cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    cancel.addEventListener("click", function () {
      lastResult = null;
      render();
      emitSize();
    });
    var submit = document.createElement("button");
    submit.classList.add("primary");
    submit.textContent = "Submit";
    submit.addEventListener("click", function () {
      var args = {};
      var missing = [];
      ordered.forEach(function (f) {
        var inp = inputs[f.name];
        if (!inp) return;
        var dt = inp.getAttribute("data-type");
        var raw = dt === "boolean" ? !!inp.checked : inp.value;
        var empty = (dt !== "boolean") && (raw === "" || raw == null);
        if (f.required && empty) {
          missing.push(f.label || f.name);
          return;
        }
        if (empty) return;
        if (dt === "number") {
          var n = Number(raw);
          args[f.name] = isNaN(n) ? raw : n;
        } else if (dt === "json") {
          try { args[f.name] = JSON.parse(raw); }
          catch (_) { args[f.name] = raw; }
        } else {
          args[f.name] = raw;
        }
      });
      if (missing.length) {
        alert("Please fill in: " + missing.join(", "));
        return;
      }
      args._mcpAppsConfirmed = true;
      submit.disabled = true;
      cancel.disabled = true;
      submit.textContent = "Submitting…";
      fireToolsCall({ tool: payload.tool }, args, null).catch(function () {
        submit.disabled = false;
        cancel.disabled = false;
        submit.textContent = "Submit";
      });
    });
    formActions.appendChild(cancel);
    formActions.appendChild(submit);
    wrap.appendChild(formActions);
    return wrap;
  }

  function inferFieldType(v) {
    if (typeof v === "boolean") return "boolean";
    if (typeof v === "number") return "number";
    if (v && typeof v === "object") return "json";
    return "string";
  }

  function fireToolsCall(action, args, btn) {
    if (btn) btn.disabled = true;
    return call("tools/call", { name: action.tool, arguments: args || {} })
      .then(function (result) {
        lastResult = result;
        render();
        emitSize();
      })
      .catch(function (err) {
        var alert = document.createElement("div");
        alert.className = "alert";
        alert.textContent = (err && err.message) ? err.message : "Tool call failed.";
        document.getElementById("root").appendChild(alert);
        throw err;
      })
      .then(function (out) { if (btn) btn.disabled = false; return out; }, function (err) {
        if (btn) btn.disabled = false; throw err;
      });
  }

  // -------------------- prompt-mode actions --------------------
  // `mode: "prompt"` actions hand a chat-message string back to the
  // host instead of issuing `tools/call` from inside the iframe. The
  // agent (Claude / Goose) then decides whether to call the underlying
  // tool — keeping the conversation chain visible and preventing
  // out-of-band tool calls (e.g. a Delete that happens silently).
  //
  // Wire format: SEP-1865 defines `ui/message` (a JSON-RPC *request*
  // with `id`, not a notification) for posting a user turn back into
  // the conversation. The host returns `{ isError?: boolean }`. Apps
  // MUST check `hostCapabilities.message` from the `ui/initialize`
  // response before sending — hosts that don't advertise it will
  // silently drop the request. When the capability is missing we fall
  // back to an in-iframe panel where the user can copy the prompt
  // and paste it manually.
  //
  // Spec refs:
  //   github.com/modelcontextprotocol/ext-apps
  //     specification/draft/apps.mdx (lines 1109-1146, capabilities 522)
  //     src/spec.types.ts (CreateMessageRequest, HostCapabilities)
  // Click handler: resolve the template, show a panel that lets the
  // user pick between "Send to chat" (post via SEP-1865 `ui/message`
  // so it appears as a user turn) and "Copy" (manual paste). The
  // Send button is disabled when the host hasn't advertised the
  // `message` capability — typically older Claude.ai / Goose builds.
  function firePromptAction(action, btn, currentData) {
    var prompt = resolvePromptText(action, currentData);
    if (!prompt) {
      prompt = (action.label || "Run") + " " + (action.tool || "tool");
    }
    showPromptPanel(prompt);
    emitSize();
  }

  function postMessageToHost(prompt) {
    // SEP-1865 `ui/message` request (not a notification — has `id`,
    // returns `{ isError?: boolean }`). Apps must check
    // `hostCapabilities.message` first; hosts that don't advertise it
    // silently drop the request.
    return call("ui/message", {
      role: "user",
      content: [{ type: "text", text: prompt }]
    });
  }

  function resolvePromptText(action, currentData) {
    var sel = action.select || "none";
    if (sel === "none") {
      // Server-side substitution already applied for `select: none`.
      // The bundle still substitutes against `currentData` as a
      // fallback for templates the server couldn't resolve.
      if (typeof action.prompt === "string") {
        var ctx = currentData && typeof currentData === "object" ? currentData : {};
        return substituteString(action.prompt, ctx);
      }
      return action.prompt || "";
    }
    var tmpl = action.promptTemplate || action.prompt;
    if (typeof tmpl !== "string") return "";
    if (sel === "single") {
      var idx = selection.selectedIdx;
      var row = idx === null ? {} : (selection.rows[idx] || {});
      var ctx2 = {};
      Object.keys(row).forEach(function (k) { ctx2[k] = row[k]; });
      ctx2.row = row;
      return substituteString(tmpl, ctx2);
    }
    // multi
    var picked = [];
    selection.multiIdx.forEach(function (i) { picked.push(selection.rows[i]); });
    return substitutePromptMulti(tmpl, picked);
  }

  function substitutePromptMulti(tmpl, rows) {
    return tmpl.replace(/\$\{([^}]+)\}/g, function (m, key) {
      if (key === "rows") {
        try { return JSON.stringify(rows); } catch (_) { return String(rows); }
      }
      var proj = /^rows\[\]\.(.+)$/.exec(key);
      if (proj) {
        return rows.map(function (r) { return r ? String(r[proj[1]]) : ""; }).join(", ");
      }
      var v = lookupSingle(rows[0] || {}, key);
      if (v === undefined) return m;
      if (v === null) return "";
      if (typeof v === "object") {
        try { return JSON.stringify(v); } catch (_) { return String(v); }
      }
      return String(v);
    });
  }

  function showPromptPanel(prompt) {
    var root = document.getElementById("root");
    var prior = root.querySelector(".prompt-panel");
    if (prior) prior.parentNode.removeChild(prior);

    var panel = document.createElement("div");
    panel.className = "prompt-panel";
    var label = document.createElement("div");
    label.className = "prompt-label";
    label.textContent = "Send this to chat, or copy it to paste manually — the agent decides whether to act:";
    var text = document.createElement("div");
    text.className = "prompt-text";
    text.textContent = prompt;

    var actionsRow = document.createElement("div");
    actionsRow.className = "prompt-actions";

    var send = document.createElement("button");
    send.classList.add("primary");
    send.textContent = "Send to chat";
    // The reference SEP-1865 example doesn't gate on
    // `hostCapabilities.message` — it calls `ui/message` and treats
    // `isError`/thrown errors as the failure signal. We do the same so
    // hosts that support `ui/message` but don't advertise it (the
    // capability is optional today) aren't blocked.
    send.addEventListener("click", function () {
      send.disabled = true;
      send.textContent = "Sending…";
      postMessageToHost(prompt).then(function (res) {
        if (res && res.isError) {
          send.textContent = "Send failed — use Copy";
        } else {
          // Successful post — the message is now a user turn in the
          // chat; dismiss the panel so the iframe stays uncluttered.
          if (panel.parentNode) panel.parentNode.removeChild(panel);
          emitSize();
        }
      }).catch(function () {
        send.textContent = "Not supported — use Copy";
        send.title = "This host does not implement ui/message";
      });
    });

    var copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click", function () {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(prompt).catch(function () {});
        }
      } catch (_) { /* best-effort */ }
      copy.textContent = "Copied";
      setTimeout(function () { copy.textContent = "Copy"; }, 1500);
    });

    var dismiss = document.createElement("button");
    dismiss.textContent = "Dismiss";
    dismiss.addEventListener("click", function () {
      if (panel.parentNode) panel.parentNode.removeChild(panel);
      emitSize();
    });

    actionsRow.appendChild(send);
    actionsRow.appendChild(copy);
    actionsRow.appendChild(dismiss);
    panel.appendChild(label);
    panel.appendChild(text);
    panel.appendChild(actionsRow);
    root.appendChild(panel);
  }
})();
</script>
</body>
</html>
