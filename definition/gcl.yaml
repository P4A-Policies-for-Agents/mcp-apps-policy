---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Apps Policy
    description: |
      Turns any MCP server fronted by Omni Gateway into an MCP Apps host
      surface. The policy injects the MCP Apps extension metadata
      (`io.modelcontextprotocol/ui`, SEP-1865) into discovery and tool
      results so MCP-Apps-aware hosts (Claude Desktop, Claude.ai,
      VS Code Copilot, Goose, Postman, MCPJam, Archestra, ...) render
      tools as interactive iframe apps.

      What it does, on the wire, with no upstream changes:

      - `tools/list` results: each tool gets `_meta.ui.resourceUri =
        "ui://mcp-apps-policy/<toolName>"` so the host knows it can be
        rendered as an app.
      - `resources/list` results: a `ui://` entry is added per tool.
      - `resources/read` for any `ui://mcp-apps-policy/...` URI: the
        policy short-circuits and returns an embedded HTML bundle (a
        small vanilla-JS app that handshakes via postMessage, listens
        for `ui/notifications/tool-result`, auto-renders by shape, and
        offers buttons for next-step tool calls).
      - `tools/call` results: ensures the result has a clean
        `structuredContent` for the UI (parsing `content[0].text` if it
        carries JSON). Optionally injects suggested next-tool actions
        the embedded UI renders as buttons that call other tools via
        `tools/call` proxied by the host.

      Three independently configurable transforms:

      - `appifyTools`     — (a) advertise tools as apps in `tools/list`
                                and `resources/list`.
      - `appifyResponses` — (b) shape `tools/call` results for the UI.
      - `appifyActions`   — (c) inject suggested next-tool actions.

      The policy only engages on JSON-RPC 2.0 traffic (MCP). Plain REST
      and other content passes through untouched. Hosts that do not
      support the MCP Apps extension simply ignore the `_meta.ui` field
      and behave exactly as before.

      MCP Apps is an extension layered on the core MCP specification.
      See https://modelcontextprotocol.io/extensions/apps/overview and
      https://github.com/modelcontextprotocol/ext-apps for the protocol.
    category: AI
    metadata/interfaceScope: api,resource
    metadata/capabilities/injectionPoint: outbound
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    # ------------------------------------------------------------------
    # Master switches
    # ------------------------------------------------------------------
    appifyTools:
      type: boolean
      default: true
      description: |
        (a) When true, the policy walks `tools/list` results and adds
        `_meta.ui = { resourceUri: "ui://mcp-apps-policy/<toolName>" }`
        to each tool. The same tool also appears as a `ui://` entry in
        `resources/list` so MCP-Apps-aware hosts know to fetch the UI.

        Hosts that don't support the extension ignore the metadata —
        nothing breaks. Set to `false` to disable app advertisement
        without disabling response shaping.
    appifyResponses:
      type: boolean
      default: true
      description: |
        (b) When true, the policy normalises `tools/call` results so
        they're ready for the UI: if `result.structuredContent` is
        missing and `result.content[0]` is a text block whose body
        parses as JSON, the parsed value is copied into
        `structuredContent`. Per the MCP Apps spec, `structuredContent`
        is what the iframe consumes; `content` continues to feed the
        model context. Existing `structuredContent` is preserved.
    appifyActions:
      type: boolean
      default: true
      description: |
        (c) When true, the policy injects suggested next-tool actions
        into `tools/call` results based on the matching `tools[]` /
        `defaultActions` entries. The embedded UI renders these as
        buttons. What clicking the button does depends on the action's
        `mode`:
          - `call`   : the iframe issues `tools/call` for the target
                       tool directly through the host.
          - `form`   : the iframe opens an inline edit form, then
                       issues `tools/call` on submit.
          - `prompt` : the iframe sends a chat message back to the host
                       via SEP-1865 `ui/message` so the agent re-decides
                       whether to call the underlying tool. Keeps the
                       conversation chain visible and prevents
                       out-of-band tool calls.
        No upstream changes are required for any of the three modes.

    # ------------------------------------------------------------------
    # Bundle / renderer selection
    # ------------------------------------------------------------------
    renderer:
      type: string
      enum:
        - auto
        - json
        - table
        - card
        - form
      default: auto
      description: |
        Default renderer used by the embedded HTML bundle when no
        per-tool override is configured.
        - `auto`  : inspect the tool's outputSchema (if any) and the
                    live tool result; pick table for arrays, card for
                    flat objects, form for objects with editable
                    fields, JSON viewer otherwise.
        - `json`  : pretty-printed read-only JSON viewer.
        - `table` : flat table for arrays of homogeneous objects.
        - `card`  : key/value card for objects.
        - `form`  : editable form (no submit by default; use `actions`
                    to wire a submit button to a tool).

    # ------------------------------------------------------------------
    # CSP / domain (MCP Apps spec, ChatGPT-required)
    # ------------------------------------------------------------------
    csp:
      type: object
      description: |
        Optional CSP allowlists emitted as `_meta.ui.csp` on every
        appified tool. ChatGPT's app-submission validator rejects
        templates without a CSP block; Claude.ai ignores the field
        when not relevant. Spec shape (SEP-1865 / Apps docs):
        `connectDomains`, `resourceDomains`, `frameDomains`,
        `baseUriDomains`. Each entry is a host or origin string
        (e.g. `https://api.salesforce.com`). Leave the section blank
        unless your bundle actually needs to reach a specific origin
        — the host's default restrictive CSP is fine for the embedded
        renderer.
      properties:
        connectDomains:
          type: array
          items:
            type: string
        resourceDomains:
          type: array
          items:
            type: string
        frameDomains:
          type: array
          items:
            type: string
        baseUriDomains:
          type: array
          items:
            type: string
    domain:
      type: string
      default: ""
      description: |
        Default `_meta.ui.domain` for every appified tool. ChatGPT
        requires a *unique* domain per template; if this is empty the
        policy synthesises `<toolName>.mcp-apps-policy.local` per
        tool, which satisfies the validator without any extra config.
        Override here when the bundle needs a stable origin the
        upstream API server can allowlist (the doc-recommended path
        is to use the SHA-256-keyed `*.claudemcpcontent.com` form for
        Claude, or whatever the host documents).

    # ------------------------------------------------------------------
    # Per-tool overrides
    # ------------------------------------------------------------------
    tools:
      type: array
      default: []
      description: |
        Per-tool overrides. Each entry sets the renderer and/or the
        suggested next-tool actions for one tool name. Tools not listed
        here use the default renderer and `defaultActions`.
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: |
              Tool name as advertised by the MCP server (matched
              case-sensitively against `result.tools[].name`).
          renderer:
            type: string
            default: ""
            description: |
              Override the default renderer for this tool. Same enum
              values as `renderer`. Empty = use the policy default.
          appify:
            type: boolean
            default: true
            description: |
              Set to false to exclude this tool from app advertisement
              (it will not get `_meta.ui` and will not appear in
              `resources/list`). Useful for internal admin tools.
          domain:
            type: string
            default: ""
            description: |
              Per-tool override for `_meta.ui.domain`. Falls back to
              the top-level `domain`, then to a synthesised
              `<toolName>.mcp-apps-policy.local`.
          csp:
            type: object
            description: |
              Optional per-tool override for `_meta.ui.csp`. Same shape
              as the top-level `csp`. When set, replaces the global
              default entirely (no array merging) so an operator can
              declare tighter or looser allowlists for a specific tool.
            properties:
              connectDomains:
                type: array
                items:
                  type: string
              resourceDomains:
                type: array
                items:
                  type: string
              frameDomains:
                type: array
                items:
                  type: string
              baseUriDomains:
                type: array
                items:
                  type: string
          formMode:
            type: string
            enum:
              - auto
              - skip
            default: auto
            description: |
              Controls the pre-call form behaviour when this tool is
              listed in the top-level `formTools[]`.
              - `auto` (default): the policy intercepts the agent's first
                `tools/call` and renders an in-iframe confirmation form.
                On Submit the bundle posts a chat prompt via `ui/message`
                asking the agent to re-issue the call with the
                `_mcpAppsConfirmed` marker; the policy strips the marker
                and forwards upstream.
              - `skip`: the policy does NOT intercept. Use this when the
                user has already confirmed the call through a prior
                `prompt`-mode action ("Order this material") and you
                don't want a second confirmation step.
          formFields:
            type: array
            default: []
            description: |
              Optional fields to expose on the pre-call form when this
              tool is listed in the top-level `formTools[]`. Each entry
              describes a field the agent's first call may not have
              populated — e.g. an optional `quantity`, `deliveryDate`,
              or `note`. Fields the agent already supplied are always
              shown (pre-filled); these entries add the fields the
              agent left out, so the user can complete the request
              before the real call lands. Ignored when the tool is not
              in `formTools[]`.
            items:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Argument name passed to the upstream tool.
                label:
                  type: string
                  default: ""
                  description: |
                    User-facing label. Defaults to `name` if blank.
                fieldType:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - json
                  default: string
                  description: |
                    Input widget. `string` is a single-line input,
                    `number` a numeric input, `boolean` a checkbox,
                    `json` a textarea parsed as JSON on submit.
                    (Named `fieldType`, not `type`: `type` collides
                    with a Rust keyword and breaks config-gen.)
                placeholder:
                  type: string
                  default: ""
                  description: Hint shown when the field is empty.
                required:
                  type: boolean
                  default: false
                  description: |
                    When true, the form's Submit button is disabled
                    until the field has a non-empty value.
          actions:
            type: array
            default: []
            description: |
              Suggested next-tool actions. Each action becomes a button
              in the embedded UI. Clicking the button calls the named
              tool via `tools/call` (proxied by the host).
            items:
              type: object
              required:
                - tool
                - label
              properties:
                tool:
                  type: string
                  description: |
                    Name of the tool to call when the button is
                    clicked. The host fetches its UI and opens it
                    inline.
                label:
                  type: string
                  description: Button label.
                select:
                  type: string
                  enum:
                    - none
                    - single
                    - multi
                  default: none
                  description: |
                    Row selection requirement.
                    - `none`   : action always enabled; `${field}`
                                 substitutes from top-level
                                 `structuredContent`.
                    - `single` : table renders a leading radio column;
                                 button is disabled until a row is
                                 selected. `${field}` substitutes from
                                 the selected row.
                    - `multi`  : table renders a leading checkbox
                                 column; button enabled when ≥ 1 row
                                 is selected. `${rows}` is the array
                                 of selected rows; `${rows[].Field}`
                                 projects `Field` across them.
                mode:
                  type: string
                  enum:
                    - call
                    - form
                    - prompt
                  default: call
                  description: |
                    What clicking the button does.
                    - `call`   : issue `tools/call` immediately with the
                                 substituted arguments.
                    - `form`   : open an inline form built from the
                                 selected row's keys, let the user
                                 edit, then submit. System fields
                                 (`Id` and a small denylist) are
                                 hidden but passed through unchanged.
                                 Only meaningful with `select: single`.
                    - `prompt` : do NOT call the tool from the iframe.
                                 Instead, hand a chat-message string
                                 (from `prompt`) back to the host so
                                 the agent decides whether to call the
                                 tool. Keeps the conversation chain
                                 visible — useful for actions whose
                                 outcome the user wants to confirm in
                                 chat (e.g. "Order this material",
                                 "Delete account").
                argsTemplate:
                  type: string
                  default: ""
                  description: |
                    Optional JSON template applied at click time.
                    `${field}` placeholders inside string values are
                    replaced. With `select: none` the substitution
                    happens server-side against `structuredContent`
                    (legacy behaviour, kept for back-compat). With
                    `select: single|multi` the raw template ships to
                    the bundle and substitution happens client-side
                    against the selection.
                prompt:
                  type: string
                  default: ""
                  description: |
                    Chat-message template used when `mode == prompt`.
                    Same `${field}` / `${row}` / `${rows[].Field}`
                    substitution rules as `argsTemplate`. The bundle
                    hands the resolved message to the host so the
                    agent re-decides whether to call the underlying
                    tool. Ignored for `mode: call` and `mode: form`.

    # ------------------------------------------------------------------
    # Default actions (apply to every tool)
    # ------------------------------------------------------------------
    defaultActions:
      type: array
      default: []
      description: |
        Actions appended to every tool's button row when
        `appifyActions: true`. Useful for global "go back" / "open
        catalog" navigation. Same shape as per-tool actions.
      items:
        type: object
        required:
          - tool
          - label
        properties:
          tool:
            type: string
          label:
            type: string
          select:
            type: string
            enum:
              - none
              - single
              - multi
            default: none
          mode:
            type: string
            enum:
              - call
              - form
              - prompt
            default: call
          argsTemplate:
            type: string
            default: ""
          prompt:
            type: string
            default: ""

    # ------------------------------------------------------------------
    # Pre-call forms
    # ------------------------------------------------------------------
    formTools:
      type: array
      default: []
      description: |
        Tool names that should open a confirmation form *before* the
        upstream tool runs. When the agent issues `tools/call` for a
        listed tool, the policy intercepts the request and returns a
        synthetic result whose `structuredContent` is rendered by the
        embedded bundle as an editable form pre-filled with the agent's
        arguments. The user reviews / edits / completes the form and
        clicks Submit; the bundle re-issues `tools/call` with a
        confirmation marker, which the policy strips before forwarding
        the call upstream. The agent only sees the eventual *real*
        result, so no infinite loop.

        Use this for "Create X" / "Update X" flows where the agent's
        first guess is incomplete but the operator wants the user to
        fill in optional fields before the call lands. Combine with
        per-tool `formFields[]` to expose schema-only fields the agent
        didn't touch (e.g. `quantity`, `deliveryDate`).

        Empty by default — when not listed here, `tools/call` flows
        through unchanged.
      items:
        type: string

    # ------------------------------------------------------------------
    # Deny list
    # ------------------------------------------------------------------
    denyTools:
      type: array
      default: []
      description: |
        Tool names that must never be appified, never advertised as a
        UI resource, and never targeted by an injected action. Takes
        precedence over `appifyTools` and per-tool overrides. Use for
        internal admin tools you don't want exposed to the rendering
        layer.
      items:
        type: string

    # ------------------------------------------------------------------
    # Bundle authoring (advanced)
    # ------------------------------------------------------------------
    customBundles:
      type: array
      default: []
      description: |
        Inline HTML bundles served verbatim for specific tools.
        Overrides the policy's built-in renderer entirely. The HTML
        must implement the MCP Apps postMessage protocol; see
        https://apps.extensions.modelcontextprotocol.io/api/.
      items:
        type: object
        required:
          - name
          - html
        properties:
          name:
            type: string
            description: |
              Bundle identifier. A tool overrides its renderer with
              `renderer: <name>` to use the bundle.
          html:
            type: string
            description: |
              Full HTML5 document, served as
              `text/html;profile=mcp-app`. JavaScript must be inlined
              or whitelisted via `csp.resourceDomains`.
          csp:
            type: object
            description: |
              Optional CSP overrides emitted as `_meta.ui.csp`. Same
              shape as the spec: `connectDomains`, `resourceDomains`,
              `frameDomains`, `baseUriDomains`.
            properties:
              connectDomains:
                type: array
                items:
                  type: string
              resourceDomains:
                type: array
                items:
                  type: string
              frameDomains:
                type: array
                items:
                  type: string
              baseUriDomains:
                type: array
                items:
                  type: string

    # ------------------------------------------------------------------
    # Diagnostics
    # ------------------------------------------------------------------
    previewMode:
      type: boolean
      default: false
      description: |
        When true, the policy adds an `x-mcp-apps-preview` response
        header containing a compact JSON `{action, tool}` describing
        what the policy did to this response. The body itself is
        unchanged in shape. Off in production.
    debugHeaders:
      type: boolean
      default: false
      description: |
        When true, the policy adds `x-mcp-apps-method`,
        `x-mcp-apps-tool`, `x-mcp-apps-action`, and
        `x-mcp-apps-renderer` response headers describing how each
        message was processed.
    maxBodyBytes:
      type: integer
      minimum: 1024
      maximum: 52428800
      default: 1048576
      description: |
        Cap on the response body size the policy will parse and
        transform. Bodies larger than this are passed through
        unchanged (with a `warn` log). Default 1 MiB; max 50 MiB.
